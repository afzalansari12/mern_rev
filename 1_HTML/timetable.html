<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> tiime table</title>
    
</head>
<style>
    table {
        border-collapse: collapse;
        width: 100%;
    }

    table, th, td {
        border: 1px solid black;
    }

    th, td {
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: rgb(236, 236, 236);
    }

    td {
        background-color: rgb(251, 251, 251);
    }
</style>
<body>
    <table>
        <tr>
                <thead>
                    <th>days</th>
                    <th> 1</th>
                    <th> 2</th>
                    <th> 3</th>
                    <th>  </th>

                    <th colspan="2">4</th>
                    <th colspan="2">5</th>
                   
                   
                </thead>
        </tr>

        <tr>
                <th>mon</th>
                <th> c++</th>
                <th> HTML</th>
                <th> css</th>
                <th rowspan="5">b <br>r<br>e<br>a<br>k</th>

                <th colspan="2">java</th>
                <th colspan="2">c++</th>
               
    </tr>

    <tr>
            <th>tue</th>
            <th rowspan="3"> hindi</th>
            <th colspan="2"> webdev</th>
            <th>c++</th>
            <th>html</th>
            <th> css</th>
            <th rowspan="2">os</th>
    </tr>
<tr>
        <th>wed</th>
        <th colspan="2"> c++</th>
        <th colspan="3">Django</th>
       
</tr>

<tr>
        <th>thu</th>
        <th colspan="2">java</th>

        <th>english</th>
        <th>go</th>

        <th colspan="2">networks</th>   
</tr>
<tr>
        <th>fri</th>
        <th colspan="3"> datascience</th>
        <th colspan="2"> c++</th>
        <th>go</th>
        <th>python</th>
       
</tr>

    </table>
</body>
</html>
