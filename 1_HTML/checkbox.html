<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio/checkbox </title>
</head>
<body>
    <div>
        <div>
            which is not programming language?

        </div>
        <input type="radio" name="language" id="cpp"> <label for="cpp">c++</label>;
            <input type="radio" name="language" id="java"> <label for="java">java</label>;
            <br>
            <input type="radio" name="language" id="html"> <label for="html"> HTMl</label>;
            <input type="radio" name="language" id="python"><label for="python"> python</label>;  <!-- jab koi ek option select krna hota hai tab use krte hai -->
    </div>

    <div>
        <div>
           
            which programming language do you know?
        </div>
        <input type="checkbox" name="question1"> c++;
        <input type="checkbox" name="question1"> java
        <br>
        <input type="checkbox" name="question1"> HTMl;
        <input type="checkbox" name="question1"> python;  <!-- jab koi ek option select krna hota hai tab use krte hai -->
    </div>
    
</body>
</html>
