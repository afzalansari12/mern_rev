<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid black;
            padding: 30px;
        }

        .parent{
            width: 200px;
        }

        .child{
            width: 50%;
        }
    </style>
</head>
<body>
    
    <div class="parent">
        I am a parent
        <div class="child">
            I am a child
        </div>
    </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-size: 10px;
        }

        .grandparent{
            font-size: 2em;
        }

        .parent{
            font-size: 2em;
        }

        .child{
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="grandparent">
        I am grandparent
        <div class="parent">
            I am parent
            <div class="child">
                I am child
            </div>
        </div>
    </div>
</body>
</html>


<!DOCTYPE html>

<head>

            font-size: 10px;
        }

            font-size: 2rem;
        }

        .parent{
            font-size: 3rem;
        }

        .child{
            font-size: 4rem;
        }
    </style>
</head>

<body>
    <div class="grandparent">
        I am grandparent
        <div class="parent">
            I am parent
            <div class="child">
                I am child
            </div>
        </div>
    </div>
</body>

</html>
