<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .item-1{
            background-color: aqua;
        }
        .item-2{
            background-color: rgb(134, 189, 189);
        }

        .item-3{
            background-color: rgb(244, 241, 51);
        }
        div{
           border: 1px solid black;
           width:120px;
           height: 120px;
           padding: 4px;
           display: flex;
           gap: 10px;
           align-items: center;
           justify-content: center;
           border-radius: 5px;
           /* flex-direction: column-reverse;
            */
            flex-direction: row-reverse;
            flex-direction: column;

        }
        .container{
           border-radius: 5px;
           border: 2px solid black;
           width: 600px;
           height:400px;
           justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>

    </div>
    
</body>
</html>
