<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
    
            width: 700px;
            height: 400px;
            border: 2px solid black;
            border-radius: 5px;
            padding: 10px;
        }
    
        .item {
            width: 60px;
            height: 60px;
            border: 1px solid black;
            border-radius: 5px;
    
            display: flex;
            justify-content: center;
            align-items: center;
        }
    
        .item-1 {
            background-color: aqua;
            align-self: center;
        }
    
        .item-2 {
            background-color: rgb(134, 189, 189);
            align-self: flex-start;
        }
    
        .item-3 {
            background-color: rgb(244, 241, 51);
            align-self: center;
        }
    
        .item-4 {
            background-color: pink;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
    </div>
    
</body>
</html>
